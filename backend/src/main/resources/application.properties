# Shared RDS database: values come from a private .env.aws at the repo root; without it the local Docker database is used.
spring.config.import=optional:file:.env[.properties],optional:file:.env.aws[.properties],optional:file:../.env.aws[.properties]

spring.application.name=anyguessr-backend

spring.profiles.active=database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB