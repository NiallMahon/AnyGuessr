spring.application.name=anyguessr-backend

# Shared RDS database: values come from a private .env.aws at the repo root; without it the local Docker database is used.
spring.config.import=optional:file:.env.aws[.properties],optional:file:../.env.aws[.properties]

spring.profiles.active=database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3308/${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cognito OAuth2
spring.security.oauth2.client.registration.cognito.client-id=${COGNITO_CLIENT_ID}
spring.security.oauth2.client.registration.cognito.client-secret=${COGNITO_CLIENT_SECRET}
spring.security.oauth2.client.registration.cognito.scope=openid,email,profile
spring.security.oauth2.client.registration.cognito.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.cognito.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.cognito.issuer-uri=${COGNITO_ISSUER_URI}
spring.security.oauth2.client.registration.cognito.scope=openid,email,phone