spring.application.name=anyguessr-backend

# Shared RDS database: values come from a private .env.aws at the repo root; without it the local Docker database is used.
spring.config.import=optional:file:.env.aws[.properties],optional:file:../.env.aws[.properties]

spring.profiles.active=database
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.security.oauth2.client.registration.cognito.client-id=4uae9abkrikhb23hm6k8ljpmnu
spring.security.oauth2.client.registration.cognito.client-secret=${COGNITO_CLIENT_SECRET}
spring.security.oauth2.client.registration.cognito.client-authentication-method=client_secret_basic
spring.security.oauth2.client.registration.cognito.scope=phone,openid,email
spring.security.oauth2.client.registration.cognito.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.cognito.issuer-uri=https://cognito-idp.eu-north-1.amazonaws.com/eu-north-1_0Zt6dfsg4
spring.security.oauth2.client.provider.cognito.user-name-attribute=sub
logging.level.root=INFO
logging.level.org.springframework.security=INFO