spring.application.name=anyguessr-backend

# Shared RDS database: values come from a private .env.aws at the repo root; without it the local Docker database is used.
spring.config.import=optional:file:.env.aws[.properties],optional:file:../.env.aws[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}