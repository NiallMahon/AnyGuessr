# Test database: in-memory H2 built from the real schema files, including identity's location column and starter account.
spring.datasource.url=jdbc:h2:mem:identity-test;MODE=MySQL
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:../db/init/001_schema.sql,file:../db/init/003_identity_users.sql
